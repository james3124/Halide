# station-nftables.conf — flash station host firewall (ch.09 §28; default-deny posture ch.08 §10)
# Diffed at shift start by station-selftest.sh; `nft list ruleset` must match this file.
# FLASH-VLAN = 10.20.30.0/24 (example; real id in station deployment record).

flush ruleset

table inet station_filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    # bastion SSH only (ed25519, bastion host in station deployment record)
    ip saddr 10.20.30.5 tcp dport 22 accept
    # USB/IP none, mDNS none, HTTP none — station is not a server
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    # station is not a router; a flash station forwarding packets is an isolation breach
  }
  chain output {
    type filter hook output priority 0; policy drop;
    ct state established,related accept
    # allowlisted egress 1: artifact host (fetch-then-verify flashmap.json + images)
    ip daddr 198.51.100.10 tcp dport { 80, 443 } accept
    # allowlisted egress 2: transparency repo (read-only, commit-SHA pinned)
    ip daddr 198.51.100.11 tcp dport 443 accept
    # allowlisted egress 3: single NTP pool host (clock skew voids signature timestamps)
    ip daddr 198.51.100.53 udp dport 123 accept
    # office LAN + internet: dropped by policy — probe asserts named failure
    counter drop comment "egress outside allow-3"
  }
}
