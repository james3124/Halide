# telephony/refa/call-audio-routes.conf -- modem audio path switching state machine (ch.07 S29)
# Single-path invariant: exactly one active uplink/downlink route per call; transitions are
# break-before-make with 50-150ms crossfade. Host mixer owns gains (audio/refa/call-gains.conf
# per-path gains applied atomically with route; Android DSP effects bypassed always).
# This telephony-side copy is the route contract; audio/ dir holds gains/measurements.
# ASCII only.

[paths]
HANDSET = earpiece + mic
SPEAKER = loudspeaker + top-mic with AEC ref
BT-SCO = HFP via host BlueZ (hsphfpd AG, SCO link params logged; modem-PCM -> SCO -> car,
  never through container DSP)
USB-C = USB-audio headset where hw/<sku> exposes it (absent-SKU hides the row, never dead toggle)
WIRED-3.5MM = where jack exists (absent-SKU hides the row)

[daemon]
name = halide-call-audio (host, alongside halide-audio-daemon ch.05 S9)
states = IDLE -> ROUTE:<path> -> SWITCHING:<from>-><to> -> ROUTE:<path>
switching_watchdog_ms = 500 (expiry -> revert to pre-switch route + AUDIO-ROUTE-FAIL metric +
  banner "Couldn't switch audio -- still on <path>")

[transition-table]
# Event | HANDSET | SPEAKER | BT-SCO | USB/WIRED
user_taps_speaker = ->SWITCHING->SPEAKER (crossfade, AEC ref re-point) | noop idempotent |
  ->SWITCHING->SPEAKER + SCO suspend (link held 10s for fast switchback) | ->SWITCHING->SPEAKER
bt_connects_midcall = banner "Headset found -- switch? [Switch]" (NEVER auto-grab) |
  same banner | auto-route adopt new device 150ms fade | same banner
bt_disconnects_midcall = - | - | ->SWITCHING->HANDSET + "Headset lost -- back to earpiece"
  (fallback HANDSET, NEVER SPEAKER: speaker-fallback in public is a privacy injury) | -
wired_usb_plug = ->SWITCHING->WIRED silently (physical intent unambiguous) |
  ->SWITCHING->WIRED | hold BT + banner "Wired plugged -- switch? [Switch]" |
  adopt last-plugged wins, logged
wired_unplug = - | - | - | ->SWITCHING->pre-plug route (1-deep stack memory, never IDLE mid-call)
modem_crash = freeze route (hold gains, mute 200ms) -> re-apply post-ladder (route survives
  radio restart; SCO re-establish <=3s post-recovery or fallback HANDSET + banner)

[per-transition]
gains = per-path gains applied atomically with route (no loud-then-quiet; single ALSA/pipewire
  transaction; underrun counter S22 observed across every switch)
echoref = re-pointed per path (speaker-AEC ref != handset ref; asserted by pw-top + loopback diff)
privacy = ROUTE:SPEAKER persistent banner + notification-dot on both stacks (S14 honesty for audio)

[verification]
suite = tests/audio-route.sh (5 scripted environments quiet/street/car/speaker/headset from S4)
gates = each cell: route applied <=500ms, no double-route via mixer-dump, gains match,
  underrun delta <=3; BT-loss fallback-to-handset (assert never-speaker); unplug-restore;
  crash-during-call route-hold (rproc fixture mid-call -> re-applied post-ladder);
  crossfade 50-150ms via loopback envelope (below = cut, above = drop; both fail)
loopback = telephony/refa/audio-loopback-matrix.md
