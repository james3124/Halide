# voice-policy.conf -- calls, IMS/VoLTE attempt protocol, call-quality monitoring (ch.07 S4/S10/S22/S29)
# Host owns modem audio. PipeWire single mixer; modem PCM via host gains
# (audio/<sku>/call-gains.conf). Android AudioFlinger is a client, never a second mixer.
# ASCII only. No fake precision: subjective MOS sheets, no fake decimals.

[call-ownership]
outgoing_android = bridge DIAL -> MM voice-create-call (host executes)
incoming = GNOME Calls rings for MT; Android Dialer hidden v1
hfp = car/headset pairs to HOST BlueZ/PipeWire (Android BT sees bridged HFP, never raw HCI)
emergency = host dialer ALWAYS (telephony/emergency-routing.conf)

[in-call-audio-tuning]
gains = audio/<sku>/call-gains.conf (earpiece/speaker/mic/EchoRef)
tuning_set = 5 scripted calls (quiet/street/car/speaker/headset); PESQ-adjacent subjective scores
route_machine = telephony/refa/call-audio-routes.conf (single-path invariant, break-before-make
  50-150ms crossfade; SWITCHING watchdog 500ms -> revert + AUDIO-ROUTE-FAIL + banner)
privacy = ROUTE:SPEAKER shows persistent in-call banner + notification-dot on both stacks

[ims-volte-attempt-protocol]
timebox = 3 engineer-weeks per carrier, then document-and-move-on (IMS sinkholes kill projects)
ladder = (1) qmicli --ims-*/PDC check IMS APN attached; (2) logcat -b radio | grep -i ims
  (ImsService/ImsResolver); (3) dumpsys telephony.registry mImsRegistered=true; (4) MO/MT VoLTE
  call with VoLTE icon + codec (AMR-WB in dumpsys telecom)
stop_rule = step 1 never attaches -> STOP (modem fw / carrier policy blocks third-party OS, common);
  record QMI error code + fw version, publish fallback (CSFB/3G where allowed; VoLTE-only carriers ->
  label SKU/carrier combo "data-only v1" explicitly -- never sell voice on a combo that cannot do it)
emergency_ims = regulatory third rail: test only with carrier blessing on blessed fw; else route CS + flag
release_notes = per-carrier emergency status (VERIFIED-ON <carrier,date> / UNTESTED bold, no exceptions)
vowifi = depends on IMS: IMS fail -> VoWiFi fail; single matrix line, no separate project

[per-call-record-host-side-redacted]
fields = timestamp, duration, direction, RAT, signal-at-setup, codec, setup-ms, drop-cause,
  underrun-count, stall-flag (no audio content stored)
store = ~/.local/share/halide/calls/<date>.csv (never committed unredacted)
signal_inputs = RSRP/RSRQ at setup + mid-call; codec AMR-NB/WB from QMI voice info;
  jitter proxy = PCM underrun count (PipeWire) + qmicli --voice-get-call-info where exposed;
  drop cause = hangup-cause QMI code (local/remote/radio-fail); setup latency dial->alerting ms;
  one-way-audio flag = TX>0+RX=0 (or inverse) over 5s window
aggregate = weekly per blessed carrier into carrier/<id>/voice-quality.md

[quality-gates-phase3-per-blessed-carrier]
setup_success_pct >= 98 over 50 calls; drop_pct <= 2; median setup <= 8s CS;
  0 one-way-audio in 50 calls
miss_order = gains (call-gains.conf) -> antenna/RF check -> modem-fw note -> carrier escalation;
  no modem-fw bump without re-bless (S23)

[user-tooling]
settings = About -> Call quality: trailing-30-day aggregates in plain language
  ("42 calls, 2 dropped, usually connects in 5s")
report_bad_call = tags last-call record user-flagged + redacted radio snapshot
  (user-perceived quality is ground truth for P1 triage even when metrics look green)

[verification]
call_loop = tests/call-loop.sh (MO/MT alternating + hangup-cause CSV; exit 2 sans lab = pass)
audio_matrix = telephony/refa/audio-loopback-matrix.md (5 scripted environments;
  modem-audio-loopback-tests.md procedures: sidetone/echo/double-talk + SCO-vs-handset matrix)
route_matrix = tests/audio-route.sh transition cells (route <=500ms, no double-route via
  mixer-dump, gains match, underrun delta <=3; BT-loss fallback-to-handset never speaker;
  crossfade 50-150ms via loopback envelope)
