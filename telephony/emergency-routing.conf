# emergency-routing.conf -- emergency call routing tables (ch.07 S4/S10, emergency-call-certification)
# Route via HOST dialer ALWAYS. Test per region with carrier blessing or documented
# untested flag -- never claim untested emergency support. ASCII only. No certifications
# claimed here; evidence templates live in telephony/emergency/ (UNTESTED until lab passes).

[routing-rule]
all_emergency = host dialer path via Telecom emergency path (never direct ATD bypass --
  bypass passes hide routing bugs)
android = Android emergency dial intents translated to host MM voice-create-call (bridge proposes,
  host disposes; single-master S1, no second dialer)
lockscreen = 5 consecutive emergency dials from lock without unlock or unlock-bypass bug
  (lockscreen-5 record discipline reused; bypass = P0)

[region-numbers-normative-source]
source = telephony/emergency-matrix.csv (numbers_tested per region)
US = 911 (+112 camp check)
EU = 112
UK = 999 + 112
JP = 110 / 118 / 119
AU = 000 + 112
carrier_specific = plus carrier-specific routing where carrier profile names one
  (carrier-profile-example governs)

[sim-states-per-tuple]
states = provisioned SIM; expired/prepaid-zero-balance SIM; no-SIM SOS-only
  (device MUST camp SOS per 3GPP -- no-SIM refusal is P0)
roaming_flag = Y/N recorded per tuple
airplane_recovery = re-camp <=60s (S22 gate reused)

[per-tuple-execution]
1_camp = qmicli --nas-get-serving-system + MM state; record MCC/MNC + band
2_place = via Telecom emergency path to lab callbox number (LAB-ONLY default)
3_record = setup time dial->alerting (lab <=10s; live <=20s or P1) + 20s both-ways audio +
  location-indication presence (AML/QMI position-fix-sent flag where exposed; absence logged, NOT faked)
4_release = normal cause + re-camp <=60s
5_report = redacted report telephony/emergency/<region>-<sku>-<date>.md (versions, timestamps,
  setup cause codes; NO IMSI/IMEI per ch.09 S4)
fw_dimension = modem FW change invalidates ALL rows for that SKU (re-bless per S23)

[live-network-gate]
rule = lab callbox preferred; live-network ONLY under written PSAP/test-desk authorization
  (ticket id -> psap_coord_id in matrix; LAB-ONLY rows carry no id, never presented as live evidence)
window = off-peak, <=5 calls/carrier/day unless carrier authorizes more
script = pre-call announcement ("Non-emergency handset test, authorization <id>, will release
  in 20 seconds, call back <number>"); immediate release + callback-availability 10 min post-call
no_sim_live = only where PSAP explicitly authorizes SOS-absent origination (otherwise no-SIM stays
  LAB-ONLY; unauthorized SOS calls unlawful in most regions, project-ending trust breach)
spacing = 60s between dials (back-to-back emergency redials flag abuse filters)
violations = unauthorized live call or live run without --auth -> conduct P0 + quarantine unit
  results 30 days (ch.10 S6 discipline applied to process)

[untested-labeling]
vocabulary = VERIFIED-ON <carrier,date> | UNTESTED (bold, no exceptions; no "pending" without blocker)
matrix = telephony/emergency-matrix.csv covers ship regions x SKUs x SIM states with FW SHAs
  (TODO SHAs only; never fake hashes)
image_label = Settings -> About -> Regulatory built from matrix at assemble time
  (matrix/ROM mismatch refuses first-boot banner rather than shipping stale claim)
lint = scripts/emergency-label-lint.sh (per-MR + release blocking); relabel-without-retest = process P0
script_gate = tests/emergency/emergency-dial-test.sh (exit 2 sans hardware = pass)
