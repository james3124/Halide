# ss-policy.conf -- call-forwarding/waiting supplementary services via MM (ch.07 S26)
# No second master: bridge is the only writer, both UIs read MM. ASCII only.

[scope-v1]
read_write = CFU/CFB/CFNRy/CFNRc query + set; CW query + set
query_only = CLIP/CLIR query (CLIR-set gated behind explicit user confirm: hiding caller ID
  has carrier-charge and abuse implications, documented per carrier)
disabled_v1 = call-barring SET (query documented; set disabled pending carrier-acceptance
  evidence -- wrong barring password locks outbound on some networks; read-only v1 is safe)

[transport]
primary = MM Modem3gppUssd/ModemVoice supplementary-service D-Bus
  (QueryCallForwarding, SetCallForwarding, QueryCallWaiting, SetCallWaiting where exposed)
fallback = QMI voice SS (qmicli --voice-query-call-forwarding) where MM gaps exist;
  fallback path per SKU in telephony/refa/ss-path.md (same discipline as ussd-path.md)
android_codes = **21*, *43#, ##002# erase-all intercepted exactly like S25 USSD (same regex
  gate, same single-session serialization)
shared_lock = ss_ussd_mutex (SS and USSD share the modem control channel on many basebands)
  with 30s deadlock-watchdog that logs + releases + files SS-DEADLOCK metric (never wedges voice)

[host-ui]
location = Settings -> Network -> Call forwarding; GNOME Calls overflow for CW toggle
rows = per-rule, service-class voice only v1 (fax/data classes hidden, never faked)
unknown_vs_unset = "not set" vs "unknown (query failed)" DISTINGUISHED (conflating them deletes
  forwarding users cannot see)
writes = PIN->MM where carrier demands (MMI --password path); wrong-password error surfaces
  VERBATIM, no retry-loop (3 wrong SS passwords can lock SS service per carrier policy;
  UI warns before the third attempt)
erase_all = ##002# requires typed confirm + post-erase re-query proving cleared (optimistic
  "done" without re-query lets forwarding silently survive -- re-query is the gate)

[domain-rule]
ss_over = IMS vs CS domain matters (S10): VoLTE-unblessed -> SS forced over CS with domain=CS
  logged; VoLTE-only data-only v1 carrier combo -> SS rows show "unavailable on this carrier
  combo" (never fake toggles)

[verification]
suite = tests/ss-flows.sh per blessed carrier
gates = CFU set->query->erase->query round-trip; CW enable/disable round-trip; ##002# confirm +
  re-query-cleared; wrong-password verbatim error + no lockout after 1 attempt + warning copy
  before 3rd; airplane-mid-query shows unknown-state (never not-set); Android-dialed *43#
  bridge-translated with host UI reflecting within 10s (both displays agree or FAIL)
