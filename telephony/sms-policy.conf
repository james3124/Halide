# sms-policy.conf -- SMS concatenation + retry state machine wiring (ch.07 S31, S13, smsc-mmsc-detail S1)
# Owner: halide-smsd (host policy daemon) + ModemManager. Chats and Android intents both
# submit to halide-smsd; nobody hand-crafts TP-DUs twice. ASCII only.

[segmentation-3gpp-23.040]
host_segments_modem_sends = true (host segments, modem WMS send carries segmented RP payloads)
gsm7_single = 160
gsm7_concat = 153 (UDH steals 7)
ucs2_single = 70
ucs2_concat = 67 (never lossy-transliterate to GSM-7 to fit one seg; two honest segs beat mojibake)
eight_bit_data = rejected v1 UNSUPPORTED-PAYLOAD, logged, never misencoded
max_segs_outbound = 5 (longer -> UI warns "very long -- send as MMS?" + MMS handoff button)
max_segs_inbound = 10
reassembly_window_s = 60
dedupe = PDU-hash BEFORE UDH merge (dedupe-after-merge double-counts retransmitted seg 1)
udh_iei = 0x08 16-bit refs always, random-per-message via getrandom(), recorded in send record
  (8-bit ref collision across two long threads inside one hour merges threads -- forbidden)
tp_mr = per-submit increment 0-255, persisted /userdata/.halide/sms-mr (reboot resumes
  previous+1, never reuses an MR the network still holds)
udh_ref_vs_tp_mr = different scopes; implementations must not conflate them

[state-machine-per-message-id]
# persisted across halide-smsd restart: reboot mid-send resumes RETRY-WAIT,
# never silently drops nor double-sends without re-confirm.
#
# SUBMITTED -> SEGMENTED -> (per seg: RP-SEND -> WAIT-RP-ACK) -> ALL-ACKED -> WAIT-DR(optional) -> DONE
#   |              |               | RP-ERROR/TIMEOUT -> RETRY-WAIT -> RP-SEND (<=N, backoff)
#   |              |               +- STORAGE-FULL(remote SMSC full) -> HELD-SMSC-FULL -> RETRY-WAIT(long)
#   |              +- ENCODE-FAIL -> FAILED-PERMANENT (mojibake refused, exact char shown)
#   +- LOCAL-STORAGE-FULL -> HELD-LOCAL-FULL -> (after free) -> SEGMENTED

[per-leg-semantics]
rp_send = one WMS send per segment, own 12s QMI timeout (S30 row; machine owns retry, QMI only reports)
wait_rp_ack = RP-ACK advances; RP-ERROR classified below, never blanket-retried
all_acked = SMSC holds all segs (single user check; per-seg failures retried silently, no flap)
wait_dr = only where sender requested reports (Chats 2FA default-on, broadcast default-off)
rp_ack_is_not_delivered = UI copy "Sent -- waiting for delivery" (double-check requires a report)
dr_correlation = (TP-MR + destination + concat-ref) tuple within validity-period + 24h grace;
  MR alone collides after 256 sends; late reports logged LATE-DR, never applied to recycled MR
retry_identity = re-send uses SAME TP-MR + SAME UDH ref (identical bytes; SMSC dedupes if the
  first landed; new-ref-on-retry creates ghost duplicates -- forbidden)
resume_bitmap = RP-ACKed segments never re-sent after radio-loss resume (persisted)

[retry-backoff-per-segment]
timeout_12s_no_ack = RETRY-NET, 3x, backoff 10s,60s,300s exp; silent <=60s then "Retrying"
cause_41_tempfail_42_congestion = RETRY-NET, 3x, backoff 30s,120s,600s (+-25% jitter S30, carrier patience)
cause_111_proto_95_invalid_50_not_subscribed = FAIL-PERMANENT, 0 retries, exact copy
  ("Not subscribed for <type>" + support link, never bare "failed")
cause_22_smsc_memory_exceeded = HELD-SMSC-FULL, hold 1h then 3x hourly (hammering SMSC-full
  blacklists the sender on some carriers -- hold is politeness with teeth);
  copy "Carrier inbox full -- will retry automatically"
airplane_radio_lost = HELD-RADIO, hold until MODEM_SUSPECT clears (S15); resume on re-register;
  SMS >60s old needs user confirm (stale-text guard)
message_abort = any seg exhausts -> message-level abort

[inbound-storage-full]
preferred = ME with SM overflow where AT+CPMS exposes both (usable counts measured per SKU,
  see telephony/refa/sms-store.md; never datasheet-copied)
watermark_80 = background trim of safe-delete set only (host-acked read inbound segs already
  merged + mirrored to Chats/Android; unread/unmirrored NEVER auto-deleted)
watermark_95 = user banner + request RP-ACK with memory-full semantics where WMS exposes
  (network holds instead of discarding -- holding beats losing)
watermark_100 = inbound held at SMSC (network retries per validity period) + bridge mirrors
  SMS-STORAGE-FULL to Android (SmsManager RESULT_NO_MEMORY, tested; fake-success loses 2FA)
trim_audit = halide-smsd --trim-log rows ts,msg_id,mr,dir,age_days,read_bool,mirrored_bool
sim_full_special = SM-full + ME-free -> auto-move inbound to ME (CPMS shuffle logged);
  ME-full + SM-full -> banner + Chats thread pinned "storage full" until below 90% (hysteresis)

[e164-normalization]
lib = libphonenumber, country from MCC; normalization logged; wrong-country sends are P0
smsc_address = auto from SIM (EF_SMS/EF_SMSP via mmcli -i read) + manual override in Settings
  (roaming-SIM edge: some carriers need explicit SMSC when roaming -- override tested with
  roaming fixture, never discovered by travelers)

[verification]
suite = tests/sms-concat-retry.sh (lab SIMs + callbox where available; live-carrier runs labeled
  per-carrier in carrier/<id>/profile.json sms_concat field)
gates = 3x300-char each direction (merged-hash + single-bubble + <=5-seg rule); seg2-first reorder
  merges; RP-ERROR-111 FAIL-PERMANENT copy + 0 retries in audit; SMSC-full-22 1h hold, exactly
  1 attempt/hour; local-full fill-to-100% -> held -> free-5 -> auto-resume + RESULT_NO_MEMORY
  mirrored pre-free; reboot-mid-send resumes without duplicate on stock oracle (identical-ref
  SMSC-dedupe proof); MR reboot persistence (next = previous+1 from /userdata/.halide/sms-mr)
