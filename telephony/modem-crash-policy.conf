# modem-crash-policy.conf -- modem crash & recovery ladder (ch.07 S15)
# Modems crash -- plan the crash. Automatic response, no user tap. ASCII only.

[detection]
qrtr_hello_timeout_s = 5 -> MODEM_SUSPECT
rproc_state_crashed -> MODEM_DOWN

[response-auto]
1_freeze_mo = freeze new MO dials with "Radio restarting" (queued 30s, ch.05 ril-bridge S4)
2_restart = rproc restart via sysfs (or mmcli -m --reset fallback)
3_rebring = re-run bring-up ladder S2 steps 1-3 (attach, no full re-provision)
4_replay = replay queued dials/SMS with user confirm for SMS >60s old (stale-text guard --
  sending a 5-min-old "on my way" without asking is a bug, not a feature)
route_hold = call-audio route frozen (gains held, 200ms mute) -> re-applied post-ladder
  (telephony/refa/call-audio-routes.conf; BT-SCO re-establish <=3s or fallback HANDSET + banner)

[post-mortem]
bundle_dir = /var/crash/modem-<ts>/ (ramoops + qrtr trace + modem ssr dump where firmware exposes)
redaction = telephony/log-redaction.conf rules before any commit or upload

[dashboard]
rate_rule = >1 modem crash/week across dogfood fleet = P0 baseband-stability sprint (not "cosmic rays")

[verification]
drill = tests/qmi-stall-inject.sh (MM disable->enable ladder, reattach <=60s gate, S8 row)
audio_route_hold = tests/audio-route.sh crash-during-call cell (route re-applied post-ladder)
