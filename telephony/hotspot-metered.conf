# hotspot-metered.conf -- hotspot, USB-tethering & metered-link ops (ch.07 S24, S6)
# NetworkManager owns all sharing paths. Android toggles slaved via ril-bridge. ASCII only.

[ownership]
owner = NetworkManager (Wi-Fi hotspot, USB-tethering, single-client v1 gate)
android_slave = container hotspot toggle without host bearer = rejected + explained
  (same doctrine as S16 roaming toggle)
limits_v1 = 1 hotspot client; WPA2-PSK minimum (open-hotspot option ABSENT by construction);
  USB-tethering 1 host; concurrent hotspot+USB OFF (one sharing path at a time --
  routing-table simplicity is a security control)

[provisioning]
ssid_default = HALIDE-<4-hex> with per-device random PSK printed once at first-enable
psk = rotation button in Settings; stored in host keyring, NEVER in Android provider mirror
usb = usb0 via NM shared mode with same metered flag as LTE bearer
battery_guard = hotspot auto-suspends at battery <=15% (user-overridable once per session
  with explicit "may drain" confirm)
thermal_guard = thermal pause at skin-temp >=44C, resume hysteresis 2C (flapping hotspot at
  the thermal edge fails the S4 thermal gate -- hysteresis specified, not tuned later)

[metered-link-discipline]
lte_bearer = ALWAYS metered to Android ConnectivityService unless carrier profile explicitly
  marks unmetered (metered_override in carrier/<id>/apn.json S21; default absent = metered)
hotspot_clients = inherit metered; large-download guards on both stacks key off same flag
  (test: 500MB download from client warns on metered, silent on lab Wi-Fi backhaul)
data_cap_nudge = user-set monthly MB cap on LTE bearer, warn 80%, hotspot auto-off at 100%
  unless overridden (bill-shock prevention on home networks too)

[verification]
gates = hotspot 30-min stability (S6) + 2nd-client rejected with message (asserted in
  data-soak hotspot phase) + metered-flag mirror (Android
  NetworkCapabilities.NET_CAPABILITY_NOT_METERED absent on LTE, present on lab Wi-Fi) +
  thermal-pause drill (force temp via tests/thermal-spoof.sh on SACRIFICIAL unit only --
  spoof tool refuses dogfood units by serial allowlist)
