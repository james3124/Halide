# qmi-policy.conf — host→modem QMI access policy (ch.07 §1 single-master + §30 wire rule)
# OWNER: ModemManager (host) — the ONLY QMUX speaker on /dev/qrtr.
# halide-ril-bridge and halide-data-watch never speak QMUX directly (single-speaker rule:
# two QMUX speakers interleave transaction IDs and both lose).

[global]
device = /dev/qrtr
max_concurrent_txns_per_service = 8
backoff_shape = exponential, base*2^n, cap per-service, jitter 25%
total_budget_per_user_operation_s = 180
audit_log = /var/log/halide/qmi-audit.log
audit_rotate = 5x10MB
audit_redaction = imei,imsi,iccid,msisdn-hashed,content

[container]
access = denied
# Android container gets state via /run/halide/ril.sock (halide-ril-bridge), never /dev/qrtr
binder_passthrough = none

[bridges]
ril_bridge = consume-only (ril.sock)
data_watch = consume-only (ril.sock)
direct_qmi = forbidden

[timeouts]
DMS = 5s, retries 2x linear 1s+2s, idempotent
NAS = 10s (scan 30s, register 120s), register 2x 10s+30s, signal-poll 0 retries
WDS = start 15s / status 5s, start 1 retry then APN-fallback, stop 3x 2s
VOICE = dial 8s, 0 auto-retries (double-dial double-calls grandma)
UIM = 10s, 0 auto-retries (QMI retry would burn SIM PIN attempts)
SMS/WMS = send 12s / list-delete 5s, retries owned by S31 state machine
USSD = 90s network wait, 0 retries
IMS/PDC = 10s, 1x 5s, reads idempotent (S10 ladder step-1 stop rule: no attach = stop, no PDC hammer)
SS query = 15s, 1x 5s, idempotent; SS set = NO retry (S26 unknown-state strings on fail)

[audit]
schema = telephony/qmi-audit.conf (JSON row per attempt, LATE-RESPONSE drops, parent_id chains)
report = halide-qmi-report --since 24h (timeout-rate + p95 + top QMI errors)
redaction = telephony/log-redaction.conf (no IMSI/IMEI/ICCID/numbers/content in git)
