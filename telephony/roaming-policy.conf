# roaming-policy.conf -- roaming design (ch.07 S16; money + jail risk, explicit by design)
# ASCII only.

[defaults]
data_roaming = OFF default, enforced at MM (--set-allowed-modes home-only) AND at bridge
  (Android DATA_ROAMING setting slaved to host toggle -- container toggle without host =
  rejected + explained)

[new-mcc-prompt]
timing = banner within 10s of registration change ("Welcome to <country-ish MCC> --
  roaming stays off. Turn on?")
budget_nudge = per-trip roaming budget (user-set MB cap, warn at 80% -- bill-shock prevention P1)
hysteresis = 2-min border-cell dwell before prompt re-fires (no prompt spam on border commutes;
  tested with recorded cell-change fixture)
manual_pin = manual PLMN pin disables new-MCC prompt for pinned MCC but KEEPS budget nudge
  (money honesty survives manual mode)

[roaming-apn]
rule = same-SIM-different-MCC uses visited-network APN only if blessed for that pair;
  otherwise data stays OFF (no auto-guess on roaming -- guessing roams into charges, S21)

[support]
export = connection log (timestamps + MCC + bytes, redacted of content -- support script S2 names it)

[verification]
gate = roaming-SIM swap in lab (or documented UNTESTED); swap covered in carrier blessing
  campaign (ch.07 S18) with border fixture where available and hysteresis observed
