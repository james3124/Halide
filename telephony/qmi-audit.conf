# qmi-audit.conf -- QMI audit log schema + report contract (ch.07 S30)
# Log: /var/log/halide/qmi-audit.log, rotated 5x10MB.
# Redaction per telephony/log-redaction.conf (no IMSI/IMEI/ICCID/call-numbers/SMS-content;
# phone numbers hashed sha256(msisdn+salt-rotated-daily) for correlation without retention).
# ASCII only.

[row-schema]
# One JSON row per attempt:
# {"ts_mono_us":<int>,"svc":"<DMS|NAS|WDS|VOICE|UIM|IMS|SMS|SS|USSD>",
#  "qmi_msg":"<name>","txn":<1-255>,"client":"<id>",
#  "attempt_n":<int>,"timeout_ms":<int>,"backoff_ms":<int>,
#  "result":"OK|TIMEOUT|QMI-ERR-<code>|STALE-TXN|ABORTED-<cause>",
#  "latency_ms":<int>,"parent_id":"<chain-or-null>",
#  "origin":"mm|bridge|data-watch|ussd|ss"}
# Late response after host-side abandonment: matched by txn id, dropped, logged LATE-RESPONSE.
# Post-ladder re-issue is a NEW audit chain with parent_id link, never a resumed timer.

[backoff-shape]
shape = exponential base*2^n, capped per-service (see telephony/qmi-policy.conf)
jitter_percent = 25
total_budget_per_user_operation_s = 180
abort_on = airplane-toggle | sim-pull | modem-crash (result ABORTED-RADIO-LOST)

[report]
tool = halide-qmi-report --since 24h
emits = per-service timeout-rate + p95 latency + top QMI error codes
feeds = carrier/<id>/stall.log cell correlation + voice setup-ms (carrier/<id>/voice-quality.md)

[verification]
redaction_test = tests/qmi-redact.sh (seed fake IMSI adjacent to DMS response, assert absence)
stall_fixture = tests/qmi-stall-inject.sh (QMUX blackhole proxy, responses delayed 2x timeout)
fixture_gate = 6/6 classify correct (DMS->SUSPECT, WDS-start->fallback, VOICE-dial->CALL-UNKNOWN,
  UIM-verify->PIN-UNKNOWN with counter static); dial auto-retried = FAIL with audit diff
