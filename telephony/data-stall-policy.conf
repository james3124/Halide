# data-stall-policy.conf -- data-stall detection & recovery (ch.07 S20)
# Stall = registered + bearer "connected" but no user-plane throughput.
# Host (NM+MM) is detector and healer; Android mirrors via ril-bridge only
# (never heals independently -- dual-healer races flap bearers). ASCII only.

[detector-halide-data-watch]
poll_idle_s = 10
poll_screen_on_s = 5
passive_1 = NM connectivity check (connectivity-check.uri per SKU, 60s interval)
passive_2 = qmicli --wds-get-packet-statistics TX/RX byte deltas
suspect_rule = bytes frozen +-2KB over 60s while bearer state = connected
active_probe_on_suspect = 3x ICMP to carrier DNS + 1x HTTPS HEAD to connectivity URI, 10s timeout
probe_marking = halide-probe (excluded from user billing counters where carrier API allows;
  documented per carrier)
cross_check = qmicli --nas-get-signal-info + --wds-get-packet-service-status
  (RRC IDLE + DRX normal -> bearer-level; RRC disconnected while MM connected -> registration-level)

[classification]
STALL-BEARER = bytes frozen, RRC connected, probe 3/3 fail -> NM bearer down ->
  mmcli -m --simple-connect re-attach same APN (1 retry), then APN-fallback profile |
  user "Data reconnecting..." <=30s, no prompt
STALL-DNS = ICMP OK, HTTPS fail, DNS latency >5s -> rewrite /etc/resolv.conf to carrier DNS ->
  fallback 8.8.8.8 only if carrier DNS fails 3x (logged; some carriers block third-party DNS) |
  silent if healed <=30s
STALL-RRC = bytes frozen, RRC disconnected, MM connected -> MM re-register
  (--3gpp-register-home or auto), <=2 attempts | banner if >60s
STALL-MODEM = QMI timeout on all commands -> escalate to modem-crash ladder (S15),
  NOT data-stall path | "Radio restarting" (S15)
STALL-CARRIER = attach succeeds but probe fails on all APNs -> backoff + notify (likely carrier
  outage / APN deprec) | "Mobile data unavailable -- Wi-Fi suggested" + support export

[recovery-ladder-auto-max-180s]
# Never loop past 180s unattended (battery + carrier-signalling discipline).
T+0s = freeze Android DATA_STALL mirror to SUSPECT (bars stay, activity arrows freeze + "..."
  badge -- S14 rule: arrows reflect truth, never fake animation)
T+0-30s = bearer re-attach same APN; success -> RECOVERED-BEARER; log carrier/<id>/stall.log
  (timestamp, cell, signal, class, action, healed-Y/N)
T+30-60s = APN fallback (secondary APN from apn.json fallback list, S21); success ->
  RECOVERED-APN-FALLBACK + flag APN DB for review
T+60-120s = airplane-cycle-equivalent via MM (modem disable -> enable, NOT full rproc restart:
  cheaper, preserves SIM auth); success -> RECOVERED-REREGISTER
T+120-180s = escalate: user prompt ("Data stalled. Retry / Switch to Wi-Fi / Export
  diagnostics") + auto-bundle redacted stall report

[verification]
fixture = tests/data-stall-inject.sh (iptables DROP on wwan0 60s -> expect STALL-BEARER ->
  auto-recover <=90s on restore; QMI-blackhole fixture -> expect STALL-MODEM escalation)
gate = 5/5 injected stalls detected <=60s, 5/5 recovered-or-escalated <=180s
dashboard = >2 stalls/device-week across dogfood = P1 radio-stability bug (not "carrier weather")
soak = tests/data-soak.sh (1h iperf no drop; hotspot 30min; idle 8h no detach; exit 2 sans hardware = pass)
