# mms-policy.conf -- MMS adaptation engine wiring (ch.07 S5/S13, smsc-mmsc-detail S2)
# Host mmsd-tng with per-carrier MMSC/APN. Group MMS best-effort. ASCII only.

[send-path]
compose = MIME SMIL + parts
bearer_check = MMS APN attached or attach-now with progress (wrong-APN failure names
  the APN in the UI error -- opaque MMS failures are a support sink)
post = MMSC POST -> M-Send.conf -> delivery

[receive-path]
wap_push = port 2948 SMS intercepted by MM
autofetch = auto on Wi-Fi/unmetered-data; prompt on metered (user setting, default per
  carrier profile mms_autofetch_metered:false in carrier/<id>/apn.json)
decode = parts decoded -> group-thread merge (same recipients +-1 normalized = same thread;
  merge mistakes logged with thread IDs for support export)

[transcode-policy]
limit_field = mms_max_bytes per carrier (usually 300KB-1MB)
over_limit = downscale client-side + quality note shown ("resized to 600KB for <carrier>");
  silent-full-res-fail and surprise-resize both bad; chosen: resize + note
video = 1x 15s clip attempt per carrier at bring-up, result recorded (most fail --
  recorded-fail beats assumed-fail)

[bridge-direction]
store_of_record = host v1 (~/.local/share/chats + MM SMS); bridge mirrors to Android
  provider READ-ONLY v1 (direction documented, never silently bidirectional)

[verification]
gates = 3 inbound + 3 outbound with 500KB image per blessed carrier; group-thread sanity;
  per-carrier delivery_reports capability (full/partial/none) recorded in profile.json
