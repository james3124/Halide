# qrtr-policy.conf -- QRTR transport policy (ch.07 S30 wire rule + S15 crash ladder)
# OWNER: ModemManager (host) is the ONLY QMUX speaker on /dev/qrtr.
# ASCII only. No hashes/measurements here; numbers point at qmi-policy.conf.

[transport]
device = /dev/qrtr
lookup_tool = qrtr-lookup
hello_timeout_s = 5
hello_miss_state = MODEM_SUSPECT
rproc_crashed_state = MODEM_DOWN

[single-speaker]
modemmanager = speak (owns socket, owns txn-id map per (service,client-id))
ril_bridge = consume-only via /run/halide/ril.sock (never opens /dev/qrtr)
data_watch = consume-only via /run/halide/ril.sock (never opens /dev/qrtr)
container = denied (no /dev/qrtr node, no binder passthrough; see SOCKETS.md)
direct_qmi = forbidden

[txn-ids]
id_range = 1-255 (0 reserved, rolling, lowest-free-first, never blind-increment)
max_concurrent_per_service_instance = 8
queue_9th_max_s = 2
queue_metric = QMI-QUEUED
reject_over_queue = QMI-BUSY (callers back off, never open a second client)
unknown_or_expired_response = STALE-TXN counter + drop (never route to newest waiter)
wrap_stall_free_ids_zero_over_s = 5
wrap_action_hello_alive = client-release + re-get-client, pending classified TXN-EXHAUSTED
wrap_action_hello_dead = MODEM_SUSPECT, escalate per modem-crash-policy.conf

[crash-ladder-pointer]
ladder = telephony/modem-crash-policy.conf
post_mortem_dir = /var/crash/modem-<ts>/ (redacted per telephony/log-redaction.conf)
