# data-watch.conf -- halide-data-watch daemon config (ch.07 S20 detection stack host)
# Host-side poller. Never speaks QMUX directly (single-speaker rule, qrtr-policy.conf).
# ASCII only.

[daemon]
name = halide-data-watch
poll_idle_s = 10
poll_screen_on_s = 5
connectivity_uri = TODO-per-SKU (NM connectivity-check.uri, 60s interval)
scan_coordination = scan_active flag shared with PLMN scan path (plmn-policy.conf);
  scan slices pause user-plane <=30s with SCAN-PAUSE note (no false STALL-BEARER)

[inputs]
nm_state = NetworkManager bearer state (connected?)
wds_stats = qmicli --wds-get-packet-statistics (TX/RX deltas; frozen +-2KB/60s = suspect)
nas_info = qmicli --nas-get-signal-info (RRC cross-check)
wds_status = qmicli --wds-get-packet-service-status (pre-check before start: double-start
  double-bearer -- guard, S30 WDS row)
mm_state = mmcli -m <m> (registration truth for Android mirror)

[outputs]
stall_class = STALL-BEARER|STALL-DNS|STALL-RRC|STALL-MODEM|STALL-CARRIER (data-stall-policy.conf)
stall_log = carrier/<id>/stall.log (timestamp, cell, signal, class, action, healed-Y/N)
android_mirror = DATA_STALL state via ril-bridge (SUSPECT freeze at T+0; bars stay)
qmi_audit_origin = data-watch (rows per telephony/qmi-audit.conf schema)

[limits]
total_budget_per_user_operation_s = 180 (past 180s the user decides, not the daemon)
probe_marking = halide-probe (billing-counter exclusion where carrier API allows)
