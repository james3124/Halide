# plmn-policy.conf -- manual network selection + PLMN list handling (ch.07 S28)
# Host MM truth; Android Phone settings slaved read-mostly (bridge only writer).
# ASCII only.

[modes]
default = AUTOMATIC (MM 3gpp-register-auto; modem picks home/roaming per SIM policy)
manual = MANUAL:<plmn-numeric> (MM --3gpp-register-in-operator <mcc-mnc,access-tech>)
manual_survives = reboot + airplane-cycle (by design)
manual_nudge = 24h "still pinned?" nudge (travel pick must not silently camp a roaming partner at home)

[scan]
command = mmcli -m N --3gpp-scan (background, 60-120s typical)
gate = complete <=180s (tests/plmn-select.sh asserts)
progress = cancellable UI + "stale list" timestamp (results >5min labeled stale, never live)
bearer_throttle = scan pauses user-plane <=30s slices with SCAN-PAUSE note (shared
  scan_active flag with halide-data-watch so scans never false-trigger STALL-BEARER)
etiquette = never live-network brute-force scanning (callbox fixtures only)

[list-rendering]
sort = available-home -> available-roaming-partner -> forbidden -> unavailable-cached
row = operator long name (mbpi + NITZ) + ALWAYS numeric mcc-mnc (names lie, numbers do not)
row_tech = access techs seen (LTE/5G-NSA/UMTS/GSM per scan record)
roaming_hint = home vs roaming badge (S16 MCC logic); roaming-manual-select additionally
  requires roaming data-off acknowledgment unless data-roaming already on
forbidden = greyed "blocked by SIM/carrier"; selectable only via explicit override-with-warning,
  logged (repeated forbidden selects trip carrier fraud heuristics -- warning says so)
forbidden_reset = "unblock all networks" with confirm (MM --3gpp-set-forbidden-... where
  supported; unsupported-SKU path documented as gap, never faked)

[reject-cause-copy]
cause_13_15_roaming_not_allowed = "This SIM can't use <plmn> here" + suggest automatic
cause_17_network_failure = retry once + S15-ladder cross-check
timeout_120s = revert to automatic + MANUAL-REVERTED journal + banner
  (manual pick that leaves the phone camped-nowhere is worse than automatic roaming)

[composition]
manual_pin_disables = new-MCC prompt for pinned MCC (user chose it -- stop asking)
manual_pin_keeps = roaming-budget nudge (money honesty survives manual mode, ch.07 S16)

[verification]
suite = tests/plmn-select.sh (callbox 2 fake PLMNs + forbidden fixture)
gates = auto attach (S6 gate); scan <=180s both PLMNs + numeric codes; manual pin camps +
  survives airplane-cycle + 24h-nudge scheduled; forbidden warned + logged; reject-13 copy;
  timeout reverts to auto + banner; stale label on >5min scan
