# ussd-policy.conf -- USSD handling design (ch.07 S25)
# Host-owned sessions. Android MMI codes never reach the modem directly. ASCII only.

[ownership]
session_lives_in = ModemManager on host (mmcli -m N --3gpp-ussd-initiate/respond/cancel,
  or QMI UIM/voice-USSD path where MM delegates; path per SKU in telephony/refa/ussd-path.md)
android_intercept = dialer CALL intent with USSD-shaped string intercepted by halide-ril-bridge
  (pattern ^[*#].*[#]$ plus *#06# IMEI-display special case)
imei_case = *#06# shown from host qmicli --dms-get-ids with redaction banner, NEVER forwarded
  to the network
callbacks = Android onUssdFinished/UssdResponse synthesized by bridge from MM signals
serialization = one session per modem (network fact); two racing Android apps -> second gets
  USSD_BUSY (bridge enforces, modem never aborts both)

[state-machine-host-side]
IDLE -> INITIATED -> NETWORK-RESPONSE-PENDING -> MULTISTEP-AWAITING-INPUT -> CLOSED/CANCELLED/TIMEOUT

[multistep-menus]
forwarding = inbound network-notification text forwarded VERBATIM (GSM-7/UCS2 decoded host-side,
  reusing S13 PDU discipline) to initiating UI (GNOME Calls USSD sheet if host-dialed;
  Android callback + mirrored host notification if Android-dialed; single-session truth)
reply = routes back through MM respond within network timeout
idle_60s = bridge auto-sends cancel + "Session ended (no reply)" (dangling USSD state rejects
  subsequent call setups on some carriers -- cancel-on-idle is correctness, not politeness)
stk_origin = STK-initiated USSD reuses this machine with origin=STK tag (menu text logged redacted S7)

[timeout-error-ux-exact-strings]
NO-SERVICE = "Can't run codes without signal" (unregistered)
USSD-BUSY = "One code at a time -- cancel current? [Cancel]" (session active)
NETWORK-TIMEOUT = no response 90s -> cancel + billed-honesty copy (only claim "you were not
  charged for this attempt" where carrier confirms no-charge; otherwise "check balance SMS")
MMI-ERROR = "Rejected (code 0x...)" + log link (network reject with cause, never bare "failed")
SESSION-ABORTED = airplane/SIM-pull mid-session + S15 ladder state (MODEM_SUSPECT freezes reply
  box, never silently drops)

[verification]
suite = tests/ussd-flow.sh
gates = *#06# offline IMEI-display (no network); live *100#-class balance query on lab SIM
  (per-carrier result in carrier/<id>/profile.json ussd field: VERIFIED-<code> /
  REJECTED-<cause> / UNTESTED); multistep 1->2->cancel walk; 90s-timeout injection (cancel +
  string); airplane-mid-session abort (SESSION-ABORTED + recovery <=60s S8 row);
  dual-initiator race (second USSD-BUSY, first completes)
