# log-redaction.conf -- telephony log collection & redaction rules (ch.07 S7)
# Commit ONLY redacted bundles (halide-log-collect --redact). ASCII only.

[collect]
sources = journalctl -u ModemManager; mmcli --output-json (redacted); logcat -b radio;
  qrtr-lookup; dmesg; ramoops + qrtr trace + modem ssr dump (post-mortem, where exposed)

[never-in-git]
fields = IMSI, IMEI, ICCID, call numbers, SMS bodies, PDU bodies, PIN/PUK keystrokes,
  4-8-digit prompt-adjacent buffers
msisdn_rule = hashed sha256(msisdn+salt-rotated-daily) for correlation without retention
committable = cell IDs + signal numbers + FW versions + hashes + timestamps + cause codes

[tests]
qmi = tests/qmi-redact.sh <logfile> [--redact] (exit 0 clean / 1 unredacted / 2 no-file)
pin_scrub = seed 123456 near a PIN prompt, assert absence (same executable pattern as qmi test)
sms_loop = tests/sms-loop.sh + tests/sms-concat-retry.sh emit redacted CSVs (--redact strips 10+ digit runs)
