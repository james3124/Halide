# sim-pin-puk.conf -- SIM PIN/PUK flows with retry counters (ch.07 S27)
# Authority: host MM owns PIN/PUK state. Single-counter rule mirrors S1 single-master.
# ASCII only.

[authority]
owner = ModemManager (mmcli -i <idx> sim-properties: pin-required, retries-remaining where
  modem exposes it; QMI UIM verify-pin/unblock-pin responses carry retry counts)
hidden_counts = baseband hides counts -> bridge keeps conservative local counter persisted in
  /userdata/.halide/simstate that only ever UNDER-reports remaining ("2 left" when 3 remain
  is safe; reverse bricks SIMs -- bias direction specified)
android = Keyguard/TelephonyManager PIN/PUK prompts slaved: container input forwarded to MM,
  never verified locally (no second counter that disagrees)
boot_order = device lock PIN first, then SIM PIN if pin-required (ch.05 S8 rule: modem must
  not attach before owner lock exists on a stolen device)

[attempt-ladder-exact-copy]
# Settings + bridged Android sheet + support script agree on this copy.
pin_entry = shows "N attempts left" (N from modem, else conservative local)
wrong_pin = decrements + 5s UI throttle (no scripted hammering through UI)
bridge_rate_limit = max 1 verify/2s at AT/QMI level; excess returns RATE-LIMITED locally
  WITHOUT touching the SIM
pin_blocked = 3rd wrong PIN -> "PIN-BLOCKED, PUK required" (modem state asserted via re-query,
  never assumed from count -- obscure SIMs block at 5, not 3; modem is truth)
puk_triple = PUK + new-PIN + confirm-new-PIN all validated LOCALLY for format before any
  network touch (malformed PUK never consumes an attempt)
puk_fuse = 10 attempts, escalating warns ("5 left" calm -> "2 left -- STOP and call your
  carrier" red + support number from carrier/<id>/profile.json puk_help field)
puk_dead = 10th wrong PUK -> SIM-PERMANENTLY-BLOCKED (bridge asserts sim-state:
  permanently-blocked; offers only "order replacement" + export-contacts-from-host-copy path)

[guards]
keystrokes = PIN/PUK keystrokes NEVER logged (log-collect S7 redaction extended: 4-8-digit
  prompt-adjacent buffers scrubbed; redaction test seeds 123456 near a PIN prompt, asserts absence)
remember_pin = "remember SIM PIN" checkbox ABSENT by construction v1 (enterprise-P3 demand tracked
  as Phase-4 item with own threat row, never snuck in); PIN passed MM->modem transiently, buffer zeroed
reboot_suspend = preserves pin-required (drain S26 ch.05 never auto-unlocks; power-cycle re-prompts;
  test asserts mmcli -i still pin-required post-drain)
sim_swap = udev SIM-gpio + MM SimChanged either fires -> abort PUK flow + re-query new SIM state
  (stale-PUK-against-new-SIM is the classic brick vector)

[verification]
suite = tests/sim-pin-puk.sh (LAB TEST-SIMs with known PIN/PUK only -- never dogfood SIMs;
  script refuses non-lab ICCID prefix, exits 2 without hardware = pass)
gates = correct-PIN unlock <=30s + attach follows (S6 gate); 2-wrong-then-right (counter + success);
  PIN-block path on sacrificial test-SIM (3 wrong -> PUK screen + modem-state assert);
  PUK triple-format validation (bad-format never decrements -- counter static); swap-abort fixture;
  reboot-persistence; log-scrub assert
