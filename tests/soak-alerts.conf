# soak-alerts.conf — slope-alert thresholds for the 72h soak + fleet dashboards (ch.10 §15)
# Thresholds learn from field digs (§25): every closed dig may update one line here.
# Format: key=value, one per line, # comments allowed. Parsed text-only (phone-safe).

# Fleet/dogfood gates (ch.10 §10 + D4 dashboard §19)
p0_per_1k_days=1.0        # P0 per 1000 device-days — above: gate fail
boot_rate_min=1.0         # nightly-boot rate 100% required
thermal_trip_max=1        # thermal trips per soak — 1 trip = investigate, 2 = P0
quarantine_delta_max=0    # new quarantines per RC window (cap-5 policy §11 still applies)

# 72h soak slope alerts (§15: slow leaks graphed, not eyeballed)
wakeup_storm_slope_max=1.5    # new wakeup_sources appearing vs day-1 baseline (per day)
dmesg_error_growth_max=100    # dmesg error-counter growth per 24h (lines)
free_mem_drop_mb_max=50       # free-mem/ion-heap trend per 24h (slow leak slope)
modem_reattach_max=0          # reattach count (§15: 0 expected — investigate per ch.07 §15)
gauge_drift_pct_max=3.0       # full-charge-capacity vs day-1 (±3% → gauge recal bug)
