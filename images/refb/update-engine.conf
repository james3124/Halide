# update-engine.conf -- refb device-side OTA policy (ch.09 S9, update-engine-internals).
# Format KEY=VALUE, ASCII only. Consumed by update_engine + halide-ota-report.
# refb modem is slower: RADIO window extended with reason (blanket 5-min fails honest SKUs).

# payload identity (must match metadata.json from/to or device refuses)
OTA_SLOT_REQUIREMENT=inactive-only
OTA_VERIFY_ORDER=key,outer-hash,rollback-index,per-partition-streaming

# power gate (ch.09 S9: battery >= 30 pct + charger-or-override)
OTA_BATTERY_MIN_PCT=30
OTA_CHARGER_OVERRIDE_ALLOWED=1

# health-gate state machine timeouts (post-reboot commit logic)
OTA_SYSTEMD_TIMEOUT_S=90
OTA_BOOT_COMPLETED_TIMEOUT_S=300
OTA_RADIO_REGISTER_TIMEOUT_S=420
OTA_RADIO_WINDOW_REASON=refb modem cold-register p95 340s lab-measured, ADR-pending
OTA_SMS_LOOPBACK_TIMEOUT_S=300
OTA_COMMIT_OBSERVE_S=600

# rollback safety (bootloader tries-remaining on the staged slot)
OTA_NEW_SLOT_TRIES=7
OTA_ROLLBACK_REQUIRE_REPORT=1

# download (resume + hash-chunks; corrupt-chunk resume never skips final full-image SHA)
OTA_RESUME_SUPPORTED=1
OTA_HASH_CHUNKS=1

# forced-update deadline UX (consumer builds never degrade radio as coercion)
OTA_DEADLINE_MODE=honest-friction
