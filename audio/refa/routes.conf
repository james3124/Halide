# audio routes per SKU (ch07 s23 single-path invariant) - refa
# One active route per call; break-before-make 50-150ms crossfade (asserted in test).
# Gains live in call-gains.conf; Android AudioManager proposes, host disposes.
HANDSET=earpiece+mic aec_ref=handset gains_from=call-gains.conf
SPEAKER=loudspeaker+top-mic aec_ref=speaker gains_from=call-gains.conf banner=speaker-persistent
BT-SCO=hfp-via-host-bluez hsphfpd_ag sco_params=TODO-measured gains_from=call-gains.conf
WIRED-3.5MM=jack-detect-mbhc gains_from=call-gains.conf parity_pm2dB_vs_earpiece
# USB-C row absent on refa (no USB-audio headset path exposed - hidden, never dead toggle).
# Transitions: wired-plug wins over handset silently; BT+WIRED conflict asks.
# Test: tests/audio-route.sh matrix (route<=500ms, no double-route, underrun<=3).
