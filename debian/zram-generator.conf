# debian/zram-generator.conf -- compressed swap on small tiers (ch.05 section 25).
# Installed to /etc/systemd/zram-generator.conf. Backs the cgroup MemoryHigh
# rows: pressure absorbed by zstd swap before lmkd/oomd kills inside the
# container first (host Calls still rings under hog, tests/cgroup-pressure.sh).
[zram0]
zram-size = min(ram / 2, 2048)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
