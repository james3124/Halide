# debian/timesyncd.conf -- DISABLED fallback (ch.05 section 24).
# Phone SKUs run chrony (see chrony.conf in this dir): a single time
# authority is required, never two daemons disciplining the clock.
# This stub keeps timesyncd dormant on images where it is installed but
# not selected. The makestep-equivalent boot-jump behavior lives in
# chrony.conf (makestep 1 3); do not enable both.
[Time]
#NTP=
#FallbackNTP=
RootDistanceMaxSec=1
#PollIntervalMinSec=32
#PollIntervalMaxSec=2048
