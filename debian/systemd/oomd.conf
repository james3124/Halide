# debian/systemd/oomd.conf -- host systemd-oomd policy (ch.05 section 25).
# Installed to /etc/systemd/oomd.conf. Per-slice overrides live in
# oomd.conf.d/10-halide.conf in this tree.
# ManagedOOMPreference=avoid on PID1/udevd/journald is set in their
# vendor units; omit is used on nothing (everything except PID1 itself is
# killable). Container outer cgroup preference is avoid: inner lmkd kills
# cached apps first; outer breach runs lxc-stop --kill + banner, host stays up.
[OOM]
DefaultMemoryPressureDurationSec=30s
DefaultMemoryPressureLimit=60%
SwapUsedLimit=80%
