# debian/systemd/resource-limits.conf -- cgroup v2 per-unit table companion.
# (ch.05 section 25 binding table; enforcement lives in the unit files under
# debian/overlays/. scripts/cgroup-audit.sh asserts live
# systemctl show -p MemoryMax,TasksMax,CPUWeight matches this file.)
#
# Unit                                   CPUWeight/CPUQuota   MemoryHigh/MemoryMax  TasksMax  OOM pref/score
# halide-android.service (outer)         Weight 400, no quota  75% / 85% RAM        800       avoid (outer); inner lmkd first
# halide-composer / phosh.service        Weight 800            400M / 600M          150       -200 (last to kill)
# halide-audio-bridge                    Weight 700, Nice -10  150M / 250M          60        -100 (audio-safe on breach)
# halide-ril-bridge / halide-netd-bridge Weight 600            120M / 200M each     60 each   -100 (safe-mode, never drop queued SMS)
# halide-prop-bridge, notification, share Weight 200           80M / 120M           40        0 (restart + stale-banner)
# halide-telemetryd                      Weight 100, Quota 10% 60M / 100M           30        +200 (first to kill; TELEMETRY_OOM, 1h backoff; toggle: Settings -> Privacy -> Diagnostics, default off per ch.05 sec 17)
# halide-backup / halide-ota-*           Weight 300, IO 200    300M / 500M          100       kill allowed (abort + rollback)
#
# Slice layout (unified v2, systemd-as-PID1 owns the tree): system.slice
# (host daemons) + halide.slice (container + bridges + composer) + app.slice
# (user Flatpak apps) + android.slice inside the container (LXC lxc.cgroup2.*
# delegation). TasksMax rows are fork-bomb fuses (execve denied per ch.08
# section 10 seccomp; TasksMax is the second net). Container TasksMax=800 is
# sized from ps peak on REF-A + 30% headroom (per-SKU numbers in
# power/BG-BUDGET.md companion systemd/<sku>-cgroup.md).
