# 10-halide.conf -- systemd-oomd drop-in (host userspace pressure, ch.05 section 25).
# Installed to /etc/systemd/oomd.conf.d/10-halide.conf by debian/hooks/20-units.sh.
# systemd-oomd manages host pressure; container OOM preference is avoid at the
# outer cgroup (kill inside first via lmkd, breach the outer only on runaway).
[OOM]
DefaultMemoryPressureDurationSec=30s
DefaultMemoryPressureLimit=60%
SwapUsedLimit=80%
