# debian/systemd/journald-halide.conf -- journal retention (ch.05 section 19).
# Installed to /etc/systemd/journald.conf.d/10-halide.conf.
# Phone flash is not a datacenter: 300M cap + 14d window enforced here,
# committed in repo, not hand-tuned. Users see the table in
# Settings -> Privacy -> Diagnostics alongside the telemetry toggles.
[Journal]
Storage=persistent
SystemMaxUse=300M
MaxFileSec=14day
ForwardToSyslog=no
