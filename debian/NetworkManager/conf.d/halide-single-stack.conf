# debian/NetworkManager/conf.d/halide-single-stack.conf -- NM is the only
# network owner (ch.05 sections 4/32). Installed to
# /etc/NetworkManager/conf.d/halide-single-stack.conf.
# No second supplicant: wpa_supplicant is owned by NM only; the Android
# wpa_supplicant is suppressed via the container overlay
# (captive_portal_mode=0 + intent intercept ALREADY_HANDLED). No second DHCP:
# container veth is unmanaged here; addresses are pushed over
# /run/halide/netd.sock by the dispatcher hook, never configured in-container.
[main]
dhcp=internal
dns=systemd-resolved
connectivity-uri=http://connectivity-check.debian.org/
# Captive-portal detection single-owner: NM owns it (ch.05 section 32).

[keyfile]
# Container veth + bridge ports are NM-unmanaged (pushed state only).
unmanaged-devices=interface-name:veth-halide;interface-name:lxcbr0
