# debian/chrony.conf -- HALIDE NTP authority (ch.05 sections 24/29).
# Footprint decision: chrony selected over systemd-timesyncd on phone SKUs
# (NTP + NITZ + GNSS vote needs a real disciplining daemon; the choice and
# numbers are recorded in the release notes per ch.05 section 24).
# timesyncd.conf in this dir is the disabled fallback documenting the choice.

# NTP endpoints: distribution default + fallback, enumerated in the
# telemetry allowlist (tests/telemetry-off.sh). Adding a pool without
# updating the allowlist fails CI (ch.05 section 17).
pool 0.debian.pool.ntp.org iburst
pool 1.debian.pool.ntp.org iburst
fallbackpool 2.debian.pool.ntp.org

# Step the clock at boot when far off (no smear across boot_completed):
# first three updates may jump; afterwards slew only.
makestep 1 3

# Record stratum + root dispersion per sync in the journal TIME_SYNC line
# (consumed by halide-time-vote for the NTP-fresh check, ch.05 section 29).
log tracking measurements statistics
logdir /var/log/chrony

# Metered-connection behavior (ch.05 section 24): NTP sync deferred on
# metered LTE until unmetered or 24h elapsed. Implemented by the NM
# dispatcher hook (debian/net/dispatcher-90-halide.sh), not by chrony
# polling knobs alone.
