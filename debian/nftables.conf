#!/usr/sbin/nft -f
# debian/nftables.conf -- HALIDE VPN egress firewall (ch.05 sections 4/16).
# Single-stack: host filters container egress; VPN owns the default route on
# both stacks. Fail-closed: VPN down -> container egress denied, host path
# kept for OTA/update only. Checked by tests/net-firewall.sh (halide chain +
# drop/reject rule required) and tests/vpn-leak.sh (10 flaps, leaks=0).
flush ruleset

table inet halide {
    # Container traffic arrives on the LXC veth; name pinned by android.conf.in
    # companion network config (lxc.net.0.veth.pair = veth-halide).
    chain container-egress {
        type filter hook forward priority 0; policy drop;
        # Established return path always allowed (no blackhole on reply).
        ct state established,related accept
        # Update/OTA host path stays up even with VPN down (ch.05 section 16
        # netd-safe: container egress blocked except OTA-update host path).
        iifname "veth-halide" udp dport { 80, 443 } ip daddr @ota-allowlist accept
        # VPN up: container egress leaves via the TUN only (slaved route).
        iifname "veth-halide" oifname "tun*" accept
        iifname "veth-halide" oifname "rmnet*" accept
        # Kill-switch: anything else from the container is dropped + logged.
        iifname "veth-halide" log prefix "halide-vpn-kill: " drop
    }

    chain input {
        type filter hook input priority 0; policy drop;
        ct state established,related accept
        iif "lo" accept
        # Host services the container may reach: pushed DNS + bridge control.
        udp dport 53 accept
        ct state new tcp dport 22 drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
        # Host output unrestricted (host networking outlives the container).
    }

    set ota-allowlist {
        type ipv4_addr
        flags interval
        # Populated at image build with the OTA mirror prefixes; empty set
        # means no exception (fail-closed default preserved).
    }
}
