# hardware/halide/power/power-hint-values.conf - IPower runbook values (S21).
# Consumed by the IPower@5 proxy (power-hal.cpp) and asserted by
# halide-android-health-adjacent hint injection tests. No hardcoded curves
# in .cpp (same rule as lux tables, S41 - hardcoded values are untestable).
hint_INTERACTION_duration_ms=500
hint_INTERACTION_boost_deadline_ms=200
hint_SUSTAINED_PERFORMANCE_soak_min=10
hint_SUSTAINED_PERFORMANCE_concurrent_soak_min=15
rate_limit_max_hints_per_10s=64
storm_test_rapid_hints=200
socket=/run/halide/power-hint
peer=host-cpufreq-devfreq
# Inject: cmd power hint INTERACTION 500 -> socket log line + cpufreq boost
# observed in cpupower frequency-info within 200ms. Sustained 10-min soak
# logs skin-temp + throttle-trip (ch.02 S6); 15-min concurrent worst case
# (CPU+GPU load + 1080p record + LTE iperf) per S25. No boost ladder:
# hint socket perms? host governor powersave pinned by rig? SELinux?
