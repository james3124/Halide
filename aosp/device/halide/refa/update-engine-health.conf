# device/halide/refa/update-engine-health.conf - A/B health-marking gates.
# Payload format: update_engine-compatible (ch.09 S4, update-engine-internals).
# Flow: verify -> write inactive slot -> staged-slot, mark-boot-successful=false,
# tries-remaining=7 -> reboot -> gates below <=5min -> mark-boot-successful,
# else auto-rollback + halide-ota-report (redacted: versions, gate-times,
# failure stage - no IMSI). Factory reset wipes userdata, never the fallback
# slot (ch.01 S13). Channel downgrade needs explicit opt-in + backup nudge.
gate_timeout_s=300
gate_systemd=running
gate_boot_completed=1
gate_modem_registered=true
gate_sms_loopback=true
tries_remaining=7
required_battery_pct=30
require_charger_or_override=true
learned_fcc_persist=true
report_tool=halide-ota-report
# Battery-model rule (S34): OTA ships new curves with learned_fcc preserved;
# wiping learned capacity causes post-OTA "battery worse" reports.
# halide-android-health asserts learned-FCC persistence post-slot-switch.
