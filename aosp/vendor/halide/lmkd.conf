# vendor/halide/lmkd.conf - container lmkd params (ch.03 S34, ch.04 S16 area).
# Installed to /vendor/etc/lmkd.conf (see vendor-etc-mappings.txt).
# Single truth: host owns memory pressure policy; container lmkd kills
# container processes only; host systemd-oomd is monitor-only on the
# container subtree (DefaultMemoryPressureDurationSec=30s,
# ManagedOOMMemoryPressureLimit=80% action none).
# DRAM-size fork (ch.02 S19): 4GB vs 6GB tables side-by-side, never one table
# with "adjust for RAM" prose. PSI-mode enabled; matching dalvik heap sizing
# lives in device/halide/<sku>/device.mk.

# --- 4GB variant (refa base) ---
minfree_levels_4gb=18432,23040,27648,32256,55296,80640
kill_heaviest_task=true
kill_timeout_ms=100
psi_mode=true

# --- 6GB+ variant (refa-6gb overlay) ---
minfree_levels_6gb=18432,27648,36864,55296,73728,110592
kill_heaviest_task=true
kill_timeout_ms=100
psi_mode=true

# Props (device.mk, repeated here as the asserted contract):
# ro.lmk.psi_complete_stall_ms=150
# ro.lmk.psi_partial_stall_ms=200
# ro.lmk.thrashing_limit=100
# Verify per release per variant: lmkd-test (fill to each minfree level,
# cached->empty->perceptible kill order, foreground survives to PERCEPTIBLE;
# foreground kill = P0) + 50-app churn (boot_completed stays 1).
