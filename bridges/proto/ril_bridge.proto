syntax = "proto3";
// halide ril bridge stub — text only, matches bridges/ril_bridge.py verbs
package halide.ril;

message Signal {
  int32 rssi_dbm = 1;   // -140..0
  int32 timing_advance = 2;
}

message Registration {
  string state = 1;     // REGISTERED | SEARCHING | DENIED | OFF
  string plmn = 2;      // "mccmnc" numeric only (names lie, ch.07 §28)
  string rat = 3;       // LTE | 5G-NSA | UMTS | GSM
}

message CallState {
  int32 call_id = 1;
  string direction = 2; // MO | MT
  string state = 3;     // dialing | active | holding | ended
  int32 hangup_cause = 4;
  string number = 5;    // redact in any committed evidence
}

message SmsFrame {
  string smsc = 1;
  int32 concat_ref = 2; // 16-bit UDH ref (ch.07 §31)
  int32 parts_total = 3;
  int32 part_seq = 4;
  bytes pdu = 5;        // never logged raw; redact before evidence
}

message UssdSession {
  string state = 1;     // IDLE | OPEN | BUSY (ch.07 §26 shared-channel rule)
  string code = 2;      // e.g. *#06# (session text never committed)
}

message SsQuery {
  string op = 1;        // CFU | CFB | CFNRY | CFNRC | CWN | CLIP | CLIR_Q (read-only v1)
  string result = 2;
}

message PinForward {
  string kind = 1;      // PIN | PUK (rate-limited: PIN 1s, PUK 2s, ch.07 §24)
  bool accepted = 2;
  int32 attempts_left = 3; // conservative counter, never reset by retry storm
}

service RilBridge {
  // single-stack guard: host MM owns the modem, Android is a client (ch.07 §1);
  // host replies DENIED-radio-not-ready while draining.
  rpc GetSignal(Registration) returns (Signal);      // Registration.state ignored on request
  rpc GetRegistration(Registration) returns (Registration);
  rpc Dial(CallState) returns (CallState);
  rpc SendSms(SmsFrame) returns (SmsFrame);          // returns acked frame state
  rpc Ussd(UssdSession) returns (UssdSession);       // shared channel with SS (§26)
  rpc QuerySs(SsQuery) returns (SsQuery);            // read-only v1, no set flows
  rpc ForwardPin(PinForward) returns (PinForward);   // rate-limited (§24)
}
