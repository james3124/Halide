# NMEA bridge (gnss-deepdive s1) - refa: single NMEA truth
# Path: modem GNSS engine (QMI PDS) -> host PDS client (1Hz) -> /run/halide/gnss.nmea
#   -> (a) Phosh Maps via geoclue NMEA source, (b) Android IGnss@2.1 shim
#   republishing GnssLocation + NMEA (ch04 s10).
# NOTE SOCKETS.md registry mismatch (reported, not edited here): this path is a
# regular file (NMEA log), not a socket; SOCKETS.md carries sockets only.
nmea_path=/run/halide/gnss.nmea
rate_hz=1
sentences=GPGSV+GPRMC+GPGGA+GPGSA (sat visibility counted, not just fix)
# Bring-up: NMEA 1Hz with $GPGSV sats (0 sats = antenna/RF; >=6 no-fix = engine/config).
# Validity flag travels with fix struct (time_valid=false on TIME-UNTRUSTED, ch04 s33);
# container never sees trusted-time the host rejected. Uncertainty >100ms -> untrusted.
# Fixture: sample.nmea (same dir) passes tests/gnss-assert.py (checksums, monotonic, fix).
