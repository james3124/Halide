# QMI PDS client config (gnss-deepdive s1/s2) - refa
# Host owns fix loop at 1Hz. Services: PDS_GET_GPS_SERVICE_STATE + position reports.
service_state_cmd=qmicli --pds-get-gps-service-state
service_ready_expect=READY (else modem-GNSS firmware/config - stop here)
fix_rate_hz=1
nav_rate_hz=1
geofence_rate_hz=0.1
# Power: engine off unless client holds fix request (gps wakeup-source 0 overnight
# with no nav; ch10 s8 residency gate includes this). Per-rate power delta measured
# once per SKU in coexist.md/results.md.
cold_reset_method=TODO-device: PDS reset clears battery-backed ephemeris (record method; fake-cold rejected)
# Modem FW version pinned per run (rollover behavior is FW-specific, ch04 s33).
modem_fw=TODO-measured
