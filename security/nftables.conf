# nftables.conf — HALIDE host baseline (ch.08 §10 committed ruleset; `nft list ruleset` must match)
# Default-deny forwarded traffic from container except bridge-approved marks; per-app UID-mark
# rules back the Android VPN/firewall claims (UI "block app X" = real drop rule with counter;
# the permission bridge appends/removes per-UID rules at runtime, each with a counter).

flush ruleset

table inet halide_filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ip protocol icmp accept
    # D-Bus + Wayland are unix-socket only; no network listeners on release builds
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    # container egress only via approved mark (bridges/permission-map.csv owners)
    meta mark 0x00cafe counter accept comment "approved container egress mark"
    # VPN kill-switch: host VPN on => container egress without VPN mark dropped (fail closed;
    # tests/vpn-leak.sh asserts curl from container during VPN flap fails closed)
    meta mark & 0x0000ff00 == 0x00000000 counter drop comment "vpn-kill-switch leak drop"
    counter drop comment "default-deny container forward"
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
# per-app UID drops live in runtime table inet halide_appmarks (bridge-managed, counter on
# every rule); committed baseline intentionally excludes them so `nft -c -f` stays clean.
