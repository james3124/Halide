# yama-ptrace-scope.conf -- Yama ptrace-scope config (ch.08 S10 + S31 container row)
# Owner: Security * Scope 1 is the v1 binding (restricted ptrace).
# Mirrors: AppArmor `deny ptrace` + seccomp ptrace-deny + sepolicy
# `neverallow container self:process ptrace` (neverallow.te N-02).
# One layer disabled in harness must still leave one enforcing (ch.08 S4).

kernel.yama.ptrace_scope = 1

# Scope meaning (documented so nobody "tunes" it to 0):
#   0 = classic (any same-uid ptrace) -- FORBIDDEN on all builds, CI-grepped.
#   1 = restricted (descendant-only + explicit scope) -- v1 binding, all SKUs.
#   2 = admin-only -- allowed hardening uplift with Security sign + drill proof.
#   3 = no ptrace at all -- eng-debug exemption required (userdebug only, expiry).
#
# halide-debug domain (userdebug/eng only, never user) gets descendant-scoped
# ptrace for halide-log-collect tombstone/ramoops reads; presence of the domain
# on `user` builds fails the variant gate (S31 gate 4).
