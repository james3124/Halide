# qrtr-policy.conf -- QRTR service allowlist (threat-model S5 Tampering row, ch.07 S1)
# Owner: Telephony + Security * Unknown service IDs are LOGGED + BLOCKED by
# default, never auto-bound. Denial storms correlated with the ch.07 S15 stall
# ladder (denial storm + stall correlation = P0).

[policy]
default = block-and-log

# Claimed services (one line each: id, owner, BUG, review date)
# service 0x... owner halide-radio-helper BUG TODO review TODO
# (rows filled at modem bring-up; an empty table with default-block is the
#  safe initial state -- traffic that needs a row fails loudly, not silently.)

[logging]
unknown_service = journal:QRTR-BLOCK
storm_threshold_per_min = 100
storm_action = P0-file
