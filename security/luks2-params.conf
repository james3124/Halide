# luks2-params.conf -- LUKS2 binding parameters (ch.08 S9 + S32 registry row)
# Owner: Security * This file is DOCUMENTATION of the normative registry
# (security/kdf-registry.json governs; kdf-registry-check.sh gates).
# Changing any value below is a rotation ceremony (S32), never a silent edit.

[crypt]
cipher = aes-xts-plain64        # 512-bit (256 data + 256 tweak); never "256-bit XTS" shorthand
sector_size = 4096
pbkdf = argon2id

[kdf.REF-A]
# SDM845, 6-8GB class
memory_mb = 1024                # mobile-SoC cap: >1GB OOMs slow cores at early-boot derive
iterations_t = 4
lanes_p = 2                     # matches little-core topology (measured, not copied)
unlock_slo_p50_ms = 2000
unlock_slo_p95_ms = 3000

[kdf.REF-B]
memory_mb = 1536                # raised from 1024 only with p50/p95 evidence in the MR
iterations_t = 4
lanes_p = 4
unlock_slo_p50_ms = 1600
unlock_slo_p95_ms = 2500        # faster SoC must beat REF-A (regression = P1 perf bug)

[keyslots]
count = 1                       # + recovery-escrow slot ONLY where enterprise policy demands;
                                # a universal backdoor slot is a P0 compromise drill (ch.08 S8)
pin_binding = halide-pin-derive # PIN>=6, rate-limited: 10 wrong -> 30s doubling, wipe-offer at 30
fbe_wrap = yes                  # AOSP per-app keys wrapped by LUKS-unlocked keyring (single prompt)

[wipe]
tool = halide-wipe --verify     # single implementation for all trigger paths (S21)
verify = canary-absent + header-rotated + attestation
