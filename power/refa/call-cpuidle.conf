# call-cpuidle.conf - REF-A voice-call cpuidle profile (ch.03 S33 + S38)
# Applied by halide-cpuidle-apply; active only while media.role=Phone is active.
# WHY this file exists (S33): modem DRX + deep-cpuidle race causes 40ms audio
# gaps (root-caused once, written down). During voice calls the deepest silver
# C-state is blocked; the call ends -> profile disarms (idempotency: a profile
# left armed after a call is a halide-cpuidle-apply bug + regression test, S38
# ladder step 1).
# Verify: cpupower idle-info + 8h idle residency deltas (S38 runbook); call
# soak with gap counter == 0 (S38 knob table).

# Active-profile state (asserted in halide-cpuidle-apply log):
#   CALL-PROFILE active: silver-C2 blocked
CALL_PROFILE_ACTIVE_SILVER_BLOCK=C2
CALL_PROFILE_ACTIVE_GOLD_BLOCK=none
# WHY silver-C2 only (S38 table): cluster-sleep-0 (L2 off, timer stopped,
# exit 450us) is the state whose entry/exit races modem DRX; WFI + C1 stay
# enabled so idle residency degrades gracefully instead of collapsing to WFI.
# Residency targets under this profile (S38 scenario row):
#   silver deepest >=40% (blocked variant) | gold deepest >=30% |
#   WFI share <=20% | meter <=95mA (voice call, modem DRX)
CALL_PROFILE_RESIDENCY_SILVER_MIN=40
CALL_PROFILE_RESIDENCY_GOLD_MIN=30
CALL_PROFILE_WFI_MAX=20
CALL_PROFILE_METER_MA_MAX=95

# Disarm rule: on call end, halide-cpuidle-apply restores full C-state set and
# logs CALL-PROFILE disarmed; nightly HW job asserts no armed-profile residue.
