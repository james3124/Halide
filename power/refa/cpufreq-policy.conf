# cpufreq-policy.conf - REF-A per-cluster cpufreq policy (ch.03 S33)
# Applied by halide-cpufreq.service AFTER it validates OPP signatures vs DT.
# WHY schedutil everywhere (S33): single governor v1; mixing breaks EAS
# cost-model assumptions and makes boost-hint triage ambiguous.
# WHY these knobs: see power/refa/sched-cpufreq.md (measured, not defaulted).
# CI release-branch grep: the string "performance" as a governor value FAILS
# the build (S33 rules with teeth). eng-only overrides live outside this file.
# OPP tables are silicon-specific (SDM845); REF-B has its own file - never copy.

# gold0-3 (big): latency-sensitive (composer present, audio DSP kick, RIL BH)
GOLD: governor=schedutil rate_limit_us=500 iowait_boost=1 hispeed_freq=1766400 hispeed_load=85 min=825600 max=2803200 uclamp_min_present_tasks_only=1
# WHY rate_limit_us=500: 200-tap runs 500 vs 2000 gave +6ms p95 gold at +0.4mA idle (S33).
# WHY iowait_boost=1 gold-only: storage stalls on gold (app launch); silver boost cost 11% idle (S33).
# WHY min=825600: lower OPP entry/exit (L2 flush) costs more than it saves (S33 floor rule).

# silver0-3 (little): background (logd, sync, netd-bridge polling, sensors batch drain)
SILVER: governor=schedutil rate_limit_us=1000 iowait_boost=0 hispeed_freq=1209600 hispeed_load=90 min=576000 max=1766400
# WHY rate_limit_us=1000: background ramp can be lazy; faster ramp showed no jank win (S33).
# WHY iowait_boost=0: 11% idle-current lift in 8h suspend-with-sync test (S33).
# WHY min=576000: lower OPPs break sensor-batch drain deadlines (1.8ms entry/exit, measured).

# Sustained/transient discipline (S33): max-freq sustained >2s only via
# SUSTAINED_PERFORMANCE hint through halide-power daemon (rate-limited, logged);
# 2803200 transient <=500ms storm-guarded; SEVERE thermal denies boost.
