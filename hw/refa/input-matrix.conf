# input-matrix.conf - REF-A touch matrix calibration (appendix-03A S4, ch.06 S7)
# Owner: BSP/Input. Bring-up order (S4): backlight-only -> simple-panel ->
# full panel (modetest lists mode) -> touch IRQ in /proc/interrupts grows on
# tap -> evtest 10-finger multitouch slots -> THIS matrix calibration.
# WHY committed (app-03A S4): residual value lives here with the matrix so
# panel/touch swaps re-validate instead of silently skewing touch.

# Touch controller: I2C address + IRQ GPIO + size + firmware (S13 checklist)
TOUCH_I2C_ADDR=0x38
# WHY 0x38: measured 2026-04-30 (stock DT dump); evtest must show slots first.
TOUCH_IRQ_GPIO=PENDING-stock-dump-gpio
TOUCHSCREEN_SIZE_X=1080
TOUCHSCREEN_SIZE_Y=2280
TOUCH_FW=touch_fw.bin-v12
# WHY fw v12: rproc/firmware inventory (app-03A S5) pins version + SHA in BLOB-SHA256.txt.

# Calibration matrix (3x3, row-major; identity until calibrated on HW)
MATRIX_A=1.0
MATRIX_B=0.0
MATRIX_C=0.0
MATRIX_D=0.0
MATRIX_E=1.0
MATRIX_F=0.0
MATRIX_G=0.0
MATRIX_H=0.0
MATRIX_I=1.0
RESIDUAL_PX=PENDING
# WHY residual here: ch.06 S7 procedure residual committed with matrix;
# re-calibrate on panel swap; suspend/resume display 20 cycles BEFORE composer
# integration (S4 step 5 - isolates panel power from graphics stack).

# Verification: evtest 10-finger pass + residual within ch.06 S7 bound.
