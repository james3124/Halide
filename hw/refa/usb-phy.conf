# usb-phy.conf - REF-A USB SSPHY tuning (ch.03 S35)
# Owner: BSP/Kernel. DT nodes (dwc3 + qcom,usb-ssphy + extcon + role-switch +
# vbus-regulator) carry provenance comments per S13; THIS file carries the PHY
# analog values with source tags.
# WHY source tags (S35): values from SI report or stock dump are trusted;
# DEFAULT-UNTESTED blocks the Phase-2 gate (untested PHY values ship bit
# errors at temperature).
# maximum-speed: super-speed REF-A verified with `lsusb -t` 5000M; high-speed
# fallback recorded with the eye-diagram ticket where SI is marginal.

# SSPHY analog (per SKU; REF-B owns its values - never copy across SoCs)
SSPHY_TX_DEEMPHASIS=0x24
# WHY: STOCK-DUMP 2026-04-30 (stock SS phy init sequence dump). SI-MEASURED re-check pending.
SSPHY_TX_SWING=0x3f
# WHY: STOCK-DUMP 2026-04-30. SI-MEASURED re-check pending; DEFAULT-UNTESTED would block Phase-2.
SSPHY_SOURCE_TAG=STOCK-DUMP
# Allowed: SI-MEASURED | STOCK-DUMP | DEFAULT-UNTESTED (gate-blocker, S35)

USB_MAXIMUM_SPEED=super-speed
# WHY super-speed (S35): lsusb -t must show 5000M on REF-A; fallback to
# high-speed recorded with eye-diagram ticket link if SI marginal.

# Autosuspend posture (S35 - per-interface, global stays default):
# - modem-QMI interfaces: usbcore.autosuspend=-1 QUIRK (autosuspend on QMI =
#   3s data stalls root-caused once - quirk committed with trace reference).
# - MTP/PTP gadget + accessory ports: auto (2s).
# - USB wakeup enabled ONLY for defined gesture wake (S8) + charger wake;
#   every other `enabled` in the suspend audit is a finding.
QMI_AUTOSUSPEND_QUIRK=-1
GADGET_AUTOSUSPEND_S=2

# Charger detection (qcom,qpnp-smb): SDP/CDP/DCP/HVDCP distinguish logged
# (/sys/class/power_supply/usb/type + current-max). Wrong type = slow-charge
# complaints with no logs; the type line is mandatory in battery reports.
