# wifi-bt-coex.cfg -- callbox profile: LTE B7/B41 + Wi-Fi 2.4/5 + BT SCO (rf-lab-spec S3)
# Coexistence takes run with the declared interferer set ON (rf/lab/interferers.md);
# sensitivity takes run with non-essential emitters OFF. Mixed conditions = INVALID, never averaged.
# ASCII only.

tech = LTE B7/B41 + Wi-Fi 2.4/5 + BT SCO
wifi_channels = 2.4 ch1/6/11 pinned + iperf load; 5 ch36/149
bt = SCO streaming during call (pinned headset model, battery >=80%)
host_profile_hash_required = true
carrier_blessed_fw_required = true
pass_gate = no voice drop during iperf + SCO (matrix in rf/<sku>/coexist.md S3)
proves = coexistence under load
