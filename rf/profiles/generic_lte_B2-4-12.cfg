# generic_lte_B2-4-12.cfg -- callbox profile: LTE attach + default bearer (rf-lab-spec S3)
# Mirrors host per-carrier profile; versions must match or the run is void. ASCII only.

tech = LTE
bands = B2, B4, B12
apn = <must-match host carrier/<id>/apn.json default-internet>
ims = off
volte = off
vowifi = off
host_profile_hash_required = true
carrier_blessed_fw_required = false (generic baseline; carrier profiles need blessed FW)
pass_gate = attach <=60s, ping + HTTP fetch OK
proves = baseline attach/data sanity
