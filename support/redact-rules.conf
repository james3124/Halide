# Redaction rules for halide-log-collect --redact (support-log-script S1; ch.07 S7).
# Default-on; --no-redact requires typed reason + eng build. Format: one rule per
# line (pattern = description). Tested by tests/qmi-redact.sh spot-checks.

IMSI-15digit = IMSI regex [0-9]{15} in QMI/AT/logcat slices
IMEI-15digit = IMEI regex [0-9]{15} incl *#06# read-back path
ICCID-19digit = ICCID regex [0-9]{19,20}
MSISDN-plus = phone-number regex \+[0-9]{7,15} (synthetic +1555 fixtures exempt)
QMI-TLV-denylist = QMI TLV deny list per ch.07 S7 (identity TLVs stripped)
MAC-full = MAC regex stripped (randomized MACs included)
BSSID-OUI = Wi-Fi BSSID masked to OUI only (BSSIDs locate people)
GPS-coords = decimal coords scrubbed to <COORD> on --redact verdict lines
logcat-main-full = full logcat main never collected (tombstones + FATAL slice only)
userdata-files = userdata files/photos/SMS bodies/keystrokes never collected
bundle-name = halide-logs-<sku>-<ver>-<ts>.tar.gz + printed SHA256 + size
